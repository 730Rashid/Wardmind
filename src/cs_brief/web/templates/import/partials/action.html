<div id="import-action" class="import-action"{% if oob %} hx-swap-oob="true"{% endif %}>
  {% if preview.blocker %}
  <button type="submit" form="import-mapping" class="button-primary" disabled aria-describedby="import-blocker">Import {{ accounts }}</button>
  <p id="import-blocker" class="field-help">{{ preview.blocker }}</p>
  {% else %}
  <button type="submit" form="import-mapping" class="button-primary">Import {{ accounts }}</button>
  {% endif %}
</div>
