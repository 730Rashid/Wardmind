{% extends "base.html" %}
{% block content %}
<div class="stack confirm">
  <p class="date-line"><a href="/accounts/{{ account.id | urlencode }}">Back to {{ account.name }}</a></p>
  <h1 class="page-title">Remove {{ contact.name }}?</h1>
  <p class="prose">{{ contact.name }} is deleted from the contacts of {{ account.name }}. Signals already recorded from contacts stay in the history.</p>
  <div class="error-actions">
    <form class="inline-form" method="post" action="/accounts/{{ account.id | urlencode }}/contacts/{{ contact.id }}/remove">
      <button type="submit" class="button-primary">Remove contact</button>
    </form>
    <a class="button" href="/accounts/{{ account.id | urlencode }}">Keep it</a>
  </div>
</div>
{% endblock %}
