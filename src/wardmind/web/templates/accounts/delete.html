{% extends "base.html" %}
{% from "partials/page_head.html" import page_head %}
{% block content %}
<div class="account-confirm">
  {{ page_head("Delete " ~ account.name ~ "?", "building") }}
  <p class="page-lede">It leaves your book, along with readings you added. This can't be undone.</p>
  <section class="account-section confirm-card">
    <div class="error-actions">
      <a class="button" href="/accounts/{{ account.id | idpath }}">Keep it</a>
      <form class="inline-form" method="post" action="/accounts/{{ account.id | idpath }}/delete">
        <button type="submit" class="button-primary">Delete account</button>
      </form>
    </div>
  </section>
</div>
{% endblock %}
