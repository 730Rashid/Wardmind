{% extends "base.html" %}
{% from "partials/page_head.html" import page_head %}
{% block content %}
<div class="quiet-page">
  {{ page_head(page) }}
  <p class="page-lede page-lede-quiet">{{ message }}</p>
  {% if back_href %}
  <p><a href="{{ back_href }}">{{ back_label }}</a></p>
  {% else %}
  <p><a href="/">Back to My book</a></p>
  {% endif %}
</div>
{% endblock %}
